name: Auto APK Builder

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'app/**'
      - 'android/**'
      - 'build.gradle*'
      - 'package.json'
      - 'pubspec.yaml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      project_type:
        description: '项目类型（自动检测）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - android-native
          - react-native
          - flutter

jobs:
  detect-project:
    name: 检测项目类型
    runs-on: ubuntu-latest
    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      has_android: ${{ steps.detect.outputs.has_android }}
      has_flutter: ${{ steps.detect.outputs.has_flutter }}
      has_react_native: ${{ steps.detect.outputs.has_react_native }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检测项目类型
        id: detect
        run: |
          echo "🔍 开始检测项目类型..."
          PROJECT_TYPE="auto"
          HAS_ANDROID="false"
          HAS_FLUTTER="false"
          HAS_REACT_NATIVE="false"
          
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] || [ -d "app" ]; then
            HAS_ANDROID="true"
            echo "✅ 发现 Android 项目结构"
          fi
          
          if [ -f "pubspec.yaml" ] && [ -d "android" ]; then
            HAS_FLUTTER="true"
            PROJECT_TYPE="flutter"
            echo "✅ 发现 Flutter 项目"
          fi
          
          if [ -f "package.json" ] && grep -q "react-native" package.json 2>/dev/null; then
            HAS_REACT_NATIVE="true"
            PROJECT_TYPE="react-native"
            echo "✅ 发现 React Native 项目"
          fi
          
          if [ "$PROJECT_TYPE" = "auto" ] && [ "$HAS_ANDROID" = "true" ]; then
            PROJECT_TYPE="android-native"
            echo "✅ 默认为 Android 原生项目"
          fi
          
          echo "project_type=${PROJECT_TYPE}" >> $GITHUB_OUTPUT
          echo "has_android=${HAS_ANDROID}" >> $GITHUB_OUTPUT
          echo "has_flutter=${HAS_FLUTTER}" >> $GITHUB_OUTPUT
          echo "has_react_native=${HAS_REACT_NATIVE}" >> $GITHUB_OUTPUT

  build-android:
    name: 构建 Android APK
    needs: detect-project
    if: needs.detect-project.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0

      - name: 构建 APK
        id: build
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          echo "🔨 构建 Android APK (${BUILD_TYPE})..."
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assemble${BUILD_TYPE^}
          
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ 未找到 APK"
            exit 1
          fi
          echo "✅ APK: ${APK_PATH}"
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ env.BUILD_TYPE }}
          path: ${{ steps.build.outputs.apk_path }}

  build-flutter:
    name: 构建 Flutter APK
    needs: detect-project
    if: needs.detect-project.outputs.has_flutter == 'true'
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 构建 APK
        id: build
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          echo "🔨 构建 Flutter APK..."
          flutter pub get
          flutter build apk --${BUILD_TYPE}
          
          if [ "$BUILD_TYPE" = "release" ]; then
            APK_PATH=build/app/outputs/flutter-apk/app-release.apk
          else
            APK_PATH=build/app/outputs/flutter-apk/app-debug.apk
          fi
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ env.BUILD_TYPE }}
          path: ${{ steps.build.outputs.apk_path }}

  build-react-native:
    name: 构建 React Native APK
    needs: detect-project
    if: needs.detect-project.outputs.has_react_native == 'true'
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm install

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 构建 APK
        id: build
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          echo "🔨 构建 React Native APK..."
          cd android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assemble${BUILD_TYPE^}
          cd ..
          
          if [ "$BUILD_TYPE" = "release" ]; then
            APK_PATH=app/build/outputs/apk/release/app-release.apk
          else
            APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          fi
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rn-apk-${{ env.BUILD_TYPE }}
          path: ${{ steps.build.outputs.apk_path }}

  release-apk:
    name: 发布 APK 到 Release
    needs: [detect-project, build-android, build-flutter, build-react-native]
    if: always() && (needs.build-android.result == 'success' || needs.build-flutter.result == 'success' || needs.build-react-native.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: apk-${{ github.run_number }}
          release_name: "APK Build #${{ github.run_number }}"
          body: |
            ## 📱 自动构建的 APK
            
            ### 构建信息
            - **构建编号**: #${{ github.run_number }}
            - **触发方式**: ${{ github.event_name }}
            - **项目类型**: ${{ needs.detect-project.outputs.project_type }}
            
            ### 📥 下载 APK
            从下方 Assets 下载。
          draft: false
          prerelease: ${{ github.event.inputs.build_type == 'debug' }}
          files: ./artifacts/**/*.apk

      - name: 输出链接
        run: |
          echo "🎉 APK 构建完成！"
          echo "📥 https://github.com/${{ github.repository }}/releases/tag/apk-${{ github.run_number }}"